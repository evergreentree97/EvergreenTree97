<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="210" viewBox="0 0 720 210" role="img">
  <title>Choi Sangrok build loop and live open source signals</title>
  <desc>A signal moves through observe, isolate, build, verify, and ship. Public repository data appears below.</desc>
  <style>
    .caption, .step, .meta, .value { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .caption { fill: #1f2328; font-size: 12px; font-weight: 700; letter-spacing: 1.6px; }
    .meta { fill: #656d76; font-size: 11px; }
    .step { fill: #656d76; font-size: 10px; font-weight: 600; letter-spacing: .8px; }
    .value { fill: #1f2328; font-size: 14px; font-weight: 600; }
    .accent { fill: #b36b19; }
    .route { stroke-dasharray: 3 9; animation: route 6s linear infinite; }
    .node-core { animation: pulse 7.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; opacity: .35; }
    .node-0 { animation-delay: 0s; }
    .node-1 { animation-delay: 1.5s; }
    .node-2 { animation-delay: 3s; }
    .node-3 { animation-delay: 4.5s; }
    .node-4 { animation-delay: 6s; }
    .signal { filter: drop-shadow(0 0 5px #b36b19); }
    @keyframes route { to { stroke-dashoffset: -72; } }
    @keyframes pulse { 0%, 18%, 100% { opacity: .35; transform: scale(.72); } 7% { opacity: 1; transform: scale(1.35); } }
    @media (prefers-reduced-motion: reduce) {
      .route, .node-core { animation: none; }
      .node-core { opacity: 1; transform: none; }
      .signal { display: none; }
    }
  </style>
  <rect x=".5" y=".5" width="719" height="209" fill="#ffffff" stroke="#d0d7de"/>
  <text class="caption" x="24" y="30">BUILD LOOP</text>
  <text class="meta" x="696" y="30" text-anchor="end">generated from public GitHub activity</text>
  <path d="M56 88 H664" fill="none" stroke="#afb8c1" stroke-width="1"/>
  <path class="route" d="M56 88 H664" fill="none" stroke="#b36b19" stroke-width="1.5"/>
<g>
  <circle cx="56" cy="88" r="10" fill="#ffffff" stroke="#afb8c1"/>
  <circle class="node-core node-0" cx="56" cy="88" r="4" fill="#b36b19"/>
  <text class="step" x="56" y="120" text-anchor="middle">OBSERVE</text>
</g>
<g>
  <circle cx="208" cy="88" r="10" fill="#ffffff" stroke="#afb8c1"/>
  <circle class="node-core node-1" cx="208" cy="88" r="4" fill="#b36b19"/>
  <text class="step" x="208" y="120" text-anchor="middle">ISOLATE</text>
</g>
<g>
  <circle cx="360" cy="88" r="10" fill="#ffffff" stroke="#afb8c1"/>
  <circle class="node-core node-2" cx="360" cy="88" r="4" fill="#b36b19"/>
  <text class="step" x="360" y="120" text-anchor="middle">BUILD</text>
</g>
<g>
  <circle cx="512" cy="88" r="10" fill="#ffffff" stroke="#afb8c1"/>
  <circle class="node-core node-3" cx="512" cy="88" r="4" fill="#b36b19"/>
  <text class="step" x="512" y="120" text-anchor="middle">VERIFY</text>
</g>
<g>
  <circle cx="664" cy="88" r="10" fill="#ffffff" stroke="#afb8c1"/>
  <circle class="node-core node-4" cx="664" cy="88" r="4" fill="#b36b19"/>
  <text class="step" x="664" y="120" text-anchor="middle">SHIP</text>
</g>
  <circle class="signal" r="4" fill="#b36b19">
    <animateMotion dur="7.5s" repeatCount="indefinite" path="M56 88 H664"/>
  </circle>
  <line x1="24" y1="144" x2="696" y2="144" stroke="#d0d7de"/>
  <text class="meta" x="24" y="169">OPEN SOURCE</text>
  <text class="value" x="24" y="193">EasyShimmerCompose</text>
  <text class="value accent" x="208" y="193">36 stars</text>
  <text class="meta" x="696" y="169" text-anchor="end">RECENT SIGNAL</text>
  <text class="value" x="696" y="193" text-anchor="end">K-Humanizer · 2026-07-06</text>
</svg>
