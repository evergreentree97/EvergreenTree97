<svg xmlns="http://www.w3.org/2000/svg" width="820" height="220" viewBox="0 0 820 220" role="img" aria-labelledby="title description">
  <title id="title">EasyShimmerCompose loading study</title>
  <desc id="description">A soft highlight passes across a content placeholder twice, then rests. A still composition is shown when reduced motion is preferred.</desc>
  <style>
    .surface { fill: #f4f6f3; }
    .outline { fill: none; stroke: #dce3db; }
    .skeleton { fill: #d4ded2; }
    .highlight { fill: #6d9474; }
    .sweep { animation: shimmer 2.2s linear 2 both; }
    @keyframes shimmer {
      0%, 12% { transform: translateX(-260px); }
      88%, 100% { transform: translateX(1060px); }
    }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #111812; }
      .outline { stroke: #27372b; }
      .skeleton { fill: #263b2d; }
      .highlight { fill: #8aac8c; }
    }
    @media (prefers-reduced-motion: reduce) {
      .sweep { animation: none; display: none; }
    }
  </style>
  <defs>
    <g id="content">
      <rect x="48" y="40" width="140" height="140" rx="12"/>
      <rect x="220" y="48" width="284" height="14" rx="7"/>
      <rect x="220" y="78" width="180" height="8" rx="4"/>
      <rect x="220" y="112" width="454" height="8" rx="4"/>
      <rect x="220" y="134" width="392" height="8" rx="4"/>
      <rect x="220" y="164" width="72" height="16" rx="8"/>
      <rect x="302" y="164" width="56" height="16" rx="8"/>
      <circle cx="748" cy="62" r="14"/>
    </g>
    <clipPath id="content-clip"><use href="#content"/></clipPath>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset=".5" stop-color="white" stop-opacity=".75"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="soft-band" maskUnits="userSpaceOnUse" x="0" y="0" width="260" height="220">
      <rect width="260" height="220" fill="url(#fade)"/>
    </mask>
  </defs>
  <rect class="surface" x=".5" y=".5" width="819" height="219" rx="20"/>
  <rect class="outline" x=".5" y=".5" width="819" height="219" rx="20"/>
  <use class="skeleton" href="#content"/>
  <g clip-path="url(#content-clip)">
    <g class="sweep">
      <rect class="highlight" width="260" height="220" mask="url(#soft-band)"/>
    </g>
  </g>
</svg>
