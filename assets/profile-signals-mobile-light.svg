<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="244" viewBox="0 0 360 244" role="img">
  <title>Choi Sangrok build loop and live open source signals</title>
  <desc>A signal moves through observe, isolate, build, verify, and ship. Public repository data appears below.</desc>
  <style>
    .caption, .step, .meta, .value { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .caption { fill: #1f2328; font-size: 11px; font-weight: 700; letter-spacing: 1.4px; }
    .meta { fill: #656d76; font-size: 10px; }
    .step { fill: #656d76; font-size: 8px; font-weight: 600; letter-spacing: .5px; }
    .value { fill: #1f2328; font-size: 12.5px; font-weight: 600; }
    .accent { fill: #b36b19; }
    .route { stroke-dasharray: 3 8; animation: route 6s linear infinite; }
    .node-core { animation: pulse 7.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; opacity: .35; }
    .node-0 { animation-delay: 0s; }
    .node-1 { animation-delay: 1.5s; }
    .node-2 { animation-delay: 3s; }
    .node-3 { animation-delay: 4.5s; }
    .node-4 { animation-delay: 6s; }
    .signal { filter: drop-shadow(0 0 5px #b36b19); }
    @keyframes route { to { stroke-dashoffset: -66; } }
    @keyframes pulse { 0%, 18%, 100% { opacity: .35; transform: scale(.72); } 7% { opacity: 1; transform: scale(1.35); } }
    @media (prefers-reduced-motion: reduce) {
      .route, .node-core { animation: none; }
      .node-core { opacity: 1; transform: none; }
      .signal { display: none; }
    }
  </style>
  <rect x=".5" y=".5" width="359" height="243" fill="#ffffff" stroke="#d0d7de"/>
  <text class="caption" x="16" y="25">BUILD LOOP</text>
  <text class="meta" x="344" y="25" text-anchor="end">PUBLIC ACTIVITY</text>
  <path d="M30 72 H330" fill="none" stroke="#afb8c1" stroke-width="1"/>
  <path class="route" d="M30 72 H330" fill="none" stroke="#b36b19" stroke-width="1.5"/>
<g>
  <circle cx="30" cy="72" r="8" fill="#ffffff" stroke="#afb8c1"/>
  <circle class="node-core node-0" cx="30" cy="72" r="3.5" fill="#b36b19"/>
  <text class="step" x="30" y="100" text-anchor="middle">OBSERVE</text>
</g>
<g>
  <circle cx="105" cy="72" r="8" fill="#ffffff" stroke="#afb8c1"/>
  <circle class="node-core node-1" cx="105" cy="72" r="3.5" fill="#b36b19"/>
  <text class="step" x="105" y="100" text-anchor="middle">ISOLATE</text>
</g>
<g>
  <circle cx="180" cy="72" r="8" fill="#ffffff" stroke="#afb8c1"/>
  <circle class="node-core node-2" cx="180" cy="72" r="3.5" fill="#b36b19"/>
  <text class="step" x="180" y="100" text-anchor="middle">BUILD</text>
</g>
<g>
  <circle cx="255" cy="72" r="8" fill="#ffffff" stroke="#afb8c1"/>
  <circle class="node-core node-3" cx="255" cy="72" r="3.5" fill="#b36b19"/>
  <text class="step" x="255" y="100" text-anchor="middle">VERIFY</text>
</g>
<g>
  <circle cx="330" cy="72" r="8" fill="#ffffff" stroke="#afb8c1"/>
  <circle class="node-core node-4" cx="330" cy="72" r="3.5" fill="#b36b19"/>
  <text class="step" x="330" y="100" text-anchor="middle">SHIP</text>
</g>
  <circle class="signal" r="4" fill="#b36b19">
    <animateMotion dur="7.5s" repeatCount="indefinite" path="M30 72 H330"/>
  </circle>
  <line x1="16" y1="120" x2="344" y2="120" stroke="#d0d7de"/>
  <text class="meta" x="16" y="144">OPEN SOURCE</text>
  <text class="value" x="16" y="168">EasyShimmerCompose</text>
  <text class="value accent" x="344" y="168" text-anchor="end">36 stars</text>
  <line x1="16" y1="184" x2="344" y2="184" stroke="#d0d7de"/>
  <text class="meta" x="16" y="207">RECENT SIGNAL</text>
  <text class="value" x="16" y="230">K-Humanizer</text>
  <text class="meta" x="344" y="230" text-anchor="end">2026-07-06</text>
</svg>
