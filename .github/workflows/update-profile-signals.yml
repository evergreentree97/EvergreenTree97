name: Update profile signals

on:
  schedule:
    - cron: '17 3 * * *'
      timezone: Asia/Seoul
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Render live profile signals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/render-profile-signals.mjs

      - name: Commit changed signals
        run: |
          if git diff --quiet -- assets/profile-signals-*.svg; then
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/profile-signals-*.svg
          git commit -m "Update profile signals"
          git push
